<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>機材配線図</title>
<meta name="theme-color" content="#1d2327">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="機材配線図">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout concept: 左に機材パレット、中央に無限キャンバス(Miro型)、右に選択中の機材/ケーブルの設定と集計。
   スマホでは パレット → キャンバス → 設定 の縦積み。 */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --canvas:#fafaf8; --grid:#d4d6d1; --card:#ffffff; --line:#c3c6bf;
  --g-red:#e5484d; --g-orange:#f08c00; --g-yellow:#c9a400; --g-green:#2f9e44; --g-teal:#12a3a3; --g-blue:#3b82f6; --g-purple:#9b5de5; --g-gray:#868e96;
  --floor:#f4f1e8; --floorline:#e1ddcf; --fg:#1d2327; --muted:#69706b; --sel:#d81b60; --soft:#eceee9;
  --c-sdi:#2563eb; --c-hdmi:#e8590c; --c-lan:#15803d; --c-xlr:#7c3aed; --c-power:#374151; --c-other:#6b7280;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --floor:#23282b; --floorline:#32383c;
    --g-red:#ff7b7f; --g-orange:#ffb04a; --g-yellow:#e8c547; --g-green:#5fd47a; --g-teal:#4fd6d6; --g-blue:#7ab0ff; --g-purple:#c3a0ff; --g-gray:#aab1b8;
    --bg:#15181a; --panel:#1e2225; --canvas:#181b1d; --grid:#32373a; --card:#262b2e; --line:#454b4f;
    --fg:#e8ebe9; --muted:#9aa29d; --sel:#ff5c8d; --soft:#2a2f32;
    --c-sdi:#6ea0ff; --c-hdmi:#ff9a5c; --c-lan:#4cd08a; --c-xlr:#b794ff; --c-power:#c9ced6; --c-other:#9aa1ac;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --floor:#23282b; --floorline:#32383c;
  --g-red:#ff7b7f; --g-orange:#ffb04a; --g-yellow:#e8c547; --g-green:#5fd47a; --g-teal:#4fd6d6; --g-blue:#7ab0ff; --g-purple:#c3a0ff; --g-gray:#aab1b8;
  --bg:#15181a; --panel:#1e2225; --canvas:#181b1d; --grid:#32373a; --card:#262b2e; --line:#454b4f;
  --fg:#e8ebe9; --muted:#9aa29d; --sel:#ff5c8d; --soft:#2a2f32;
  --c-sdi:#6ea0ff; --c-hdmi:#ff9a5c; --c-lan:#4cd08a; --c-xlr:#b794ff; --c-power:#c9ced6; --c-other:#9aa1ac;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px}
.app{height:100%;display:flex;flex-direction:column;gap:10px;min-width:0}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.tab,.btn{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:hover,.tab:hover{border-color:var(--fg)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.pal:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.btn.danger{color:var(--sel);border-color:var(--sel);background:transparent}
.exp{display:flex;gap:6px}
.exp[hidden]{display:none}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.main{flex:1;min-height:0;display:grid;grid-template-columns:158px minmax(0,1fr) 300px;gap:10px}
.palette{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-width:0}
.palette h2,.side h2{margin:0 0 2px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.pal{display:flex;align-items:center;gap:8px;font:inherit;font-size:12.5px;color:var(--fg);background:var(--soft);border:1px solid transparent;border-radius:8px;padding:5px 8px;cursor:grab;text-align:left}
.pal:hover{border-color:var(--fg)}
.pal svg{width:26px;height:26px;flex:none;color:var(--fg)}
.stage{position:relative;min-width:0;min-height:0;background:var(--canvas);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#cv,#pv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#cv.panning,#pv.panning{cursor:grabbing}
.cabbar{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.chip{display:flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 8px;cursor:pointer}
.chip i{display:block;width:20px;height:0;border-top:3px solid var(--cc)}
.chip[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.hint{font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);align-self:flex-start;padding:2px 8px;border-radius:6px}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.zoom .btn{padding:4px 10px;background:var(--panel)}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-y:auto;min-width:0;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;color:var(--fg);background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;width:100%}
.field textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px}
.list li{display:flex;justify-content:space-between;gap:8px;align-items:center}
.list .k{display:flex;align-items:center;gap:6px;min-width:0}
.list .k i{display:block;width:16px;border-top:3px solid var(--cc);flex:none}
.list .n{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.note{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px}
/* svg */
.node .card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.node.sel .card{stroke:var(--sel);stroke-width:2.6}
.node .hdr{fill:var(--soft)}
.node text{fill:var(--fg);font-family:var(--font);pointer-events:none}
.node .sub{fill:var(--muted)}
.node .plab{font-size:11px}
.node .ic{color:var(--fg);pointer-events:none}
.sock{fill:var(--card);stroke:var(--cc);stroke-width:2.2}
.sock.on{fill:var(--cc)}
.sock.dim{opacity:.18}
.sock.ok{stroke-width:3.6}
.sockhit{fill:transparent;cursor:crosshair}
.cutline{stroke:var(--sel);stroke-width:2;stroke-dasharray:5 4;pointer-events:none}
.cable .vis{fill:none;stroke:var(--cc);stroke-width:3;stroke-linecap:round}
.cable .halo{fill:none;stroke:var(--sel);stroke-width:9;opacity:0;stroke-linecap:round}
.cable.sel .halo{opacity:.3}
.cable .hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.cable .pill{fill:var(--panel);stroke:var(--line);stroke-width:1}
.cable.sel .pill{stroke:var(--sel)}
.cable text{fill:var(--fg);font-family:var(--font);font-size:11px;pointer-events:none}
.t-sdi{--cc:var(--c-sdi)}.t-hdmi{--cc:var(--c-hdmi)}.t-lan{--cc:var(--c-lan)}.t-xlr{--cc:var(--c-xlr)}.t-power{--cc:var(--c-power)}.t-other{--cc:var(--c-other)}
.tmp{fill:none;stroke-width:3;stroke-dasharray:6 6;stroke-linecap:round;pointer-events:none}

.ports{display:flex;flex-direction:column;gap:5px}
.prow{display:grid;grid-template-columns:10px minmax(0,1fr) 72px 44px 26px;gap:5px;align-items:center}
.prow input,.prow select,.addp select{font:inherit;font-size:12.5px;color:var(--fg);background:var(--canvas);border:1px solid var(--line);border-radius:6px;padding:3px 5px;min-width:0;width:100%}
.prow .pd{width:10px;height:10px;border-radius:50%;background:var(--cc);display:block}
.prow .x{font:inherit;color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:2px 0}
.prow .x:hover{color:var(--sel);border-color:var(--sel)}
.addp{margin-top:8px;flex-wrap:nowrap}
.addp select{width:auto;flex:1}
.addp .btn{padding:3px 8px;font-size:12.5px;white-space:nowrap}

.main[hidden]{display:none}

.c-red{--gc:var(--g-red)}.c-orange{--gc:var(--g-orange)}.c-yellow{--gc:var(--g-yellow)}.c-green{--gc:var(--g-green)}.c-teal{--gc:var(--g-teal)}.c-blue{--gc:var(--g-blue)}.c-purple{--gc:var(--g-purple)}.c-gray{--gc:var(--g-gray)}
.grp .gbody{fill:color-mix(in srgb,var(--gc) 11%,transparent);stroke:var(--gc);stroke-width:1.6;pointer-events:none}
.grp .gbar{fill:color-mix(in srgb,var(--gc) 30%,transparent);cursor:grab}
.grp .gtitle{fill:var(--fg);font-family:var(--font);font-weight:700;pointer-events:none}
.grp .gres{fill:var(--gc);cursor:nwse-resize;opacity:.85}
.grp.sel .gbody{stroke-width:2.8;stroke:var(--sel)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swb{width:26px;height:26px;border-radius:50%;background:var(--gc);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swb[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--fg)}
.swb:focus-visible{outline:2px solid var(--sel);outline-offset:3px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;color:var(--fg);background:transparent;border:0;padding:5px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
.tmpl{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tmpl button,.dbtn{font:inherit;font-size:12px;color:var(--fg);background:var(--soft);border:1px solid transparent;border-radius:8px;padding:5px 4px;cursor:pointer;line-height:1.3}
.tmpl button:hover,.dbtn:hover{border-color:var(--fg)}
.tmpl button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.tmpl small{display:block;color:var(--muted);font-size:11px}
.dims{display:flex;gap:6px;align-items:center}
.dims input{font:inherit;font-size:13px;color:var(--fg);background:var(--canvas);border:1px solid var(--line);border-radius:6px;padding:3px 5px;width:100%;min-width:0}
.dims span{font-size:12px;color:var(--muted);white-space:nowrap}
.eqrow{display:flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;color:var(--fg);background:var(--soft);border:1px solid transparent;border-radius:8px;padding:3px 6px;cursor:grab;text-align:left;width:100%}
.eqrow:hover,.eqrow.sel{border-color:var(--fg)}
.eqrow svg{width:20px;height:20px;flex:none}
.eqrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqrow .st{font-size:11px;color:var(--muted);white-space:nowrap}
.eqrow.off{opacity:.7}
.plist{display:flex;flex-direction:column;gap:5px;min-width:0}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--canvas)}
.crow.bad{border-color:var(--sel)}
.crow .t{display:flex;gap:6px;align-items:center;min-width:0}
.crow .t i{display:block;width:12px;border-top:3px solid var(--cc);flex:none}
.crow .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .m{color:var(--muted);font-size:11.5px;grid-column:1 / -1;font-variant-numeric:tabular-nums}
.crow .r{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.crow.bad .r{color:var(--sel)}
.opt{display:flex;gap:10px;align-items:center;font-size:12.5px;flex-wrap:wrap}
.opt label{display:flex;gap:4px;align-items:center}
.opt input[type=number]{width:60px;font:inherit;color:var(--fg);background:var(--canvas);border:1px solid var(--line);border-radius:6px;padding:2px 5px}
#pv text{font-family:var(--font);fill:var(--fg);pointer-events:none}
#pv .dim{fill:var(--muted);font-size:11px}
#pv .zone .zb{stroke-width:1.4;stroke-dasharray:6 4;pointer-events:none}
#pv .zone.z-stage .zb{fill:var(--c-hdmi);fill-opacity:.16;stroke:var(--c-hdmi)}
#pv .zone.z-seats .zb{fill:var(--c-lan);fill-opacity:.10;stroke:var(--c-lan)}
#pv .zone.z-other .zb{fill:var(--muted);fill-opacity:.12;stroke:var(--muted)}
#pv .zone.z-pillar .zb{fill:var(--fg);fill-opacity:.7;stroke:var(--fg);stroke-dasharray:none}
#pv .zone.z-partition .zb{fill:var(--fg);fill-opacity:.45;stroke:var(--fg);stroke-dasharray:none}
#pv .zone .ztab{fill:var(--panel);stroke:var(--line)}
#pv .zone.z-stage .ztab{stroke:var(--c-hdmi)}#pv .zone.z-seats .ztab{stroke:var(--c-lan)}
#pv .zone .ztxt{font-size:11px;font-weight:700;fill:var(--fg)}
#pv .zone .ztxt2{font-size:10px;font-weight:700;fill:var(--bg);paint-order:stroke;stroke:var(--fg);stroke-width:3px;pointer-events:none}
#pv .zone.sel .zb{stroke:var(--sel);stroke-width:2.2}
#pv .zres{fill:var(--sel);stroke:var(--panel);stroke-width:2;cursor:nwse-resize}
#pv .aim{fill:var(--fg);fill-opacity:.07;stroke:var(--fg);stroke-opacity:.4;stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
#pv .aim.sel{fill:var(--sel);fill-opacity:.12;stroke:var(--sel);stroke-opacity:.8}
#pv .aimh circle,#pv .via circle{fill:var(--panel);stroke:var(--sel);stroke-width:2}
#pv .aimh text,#pv .via text{font-size:11px;font-weight:700;fill:var(--sel);pointer-events:none}
#pv .eq .bg{fill:var(--card);stroke:var(--line);stroke-width:1.3}
#pv .eq.sel .bg{stroke:var(--sel);stroke-width:2.8}
#pv .eq .ic{color:var(--fg)}
#pv .eq .cap{font-size:11px;font-weight:700;paint-order:stroke;stroke:var(--floor);stroke-width:3px;stroke-linejoin:round}
#pv .pc .l{fill:none;stroke:var(--cc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#pv .pc .halo{fill:none;stroke:var(--sel);stroke-width:8;opacity:0;stroke-linecap:round;stroke-linejoin:round}
#pv .pc.sel .halo{opacity:.3}
#pv .pc .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
#pv .pc .pill{fill:var(--panel);stroke:var(--line)}
#pv .pc.bad .pill{stroke:var(--sel);stroke-width:1.6}
#pv .pc text{font-size:11px}
#pv .pc.bad text{fill:var(--sel);font-weight:700}
#pv .door.sel .leaf,#pv .door.sel .arc{stroke:var(--sel)}
@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto}
  .main{display:flex;flex-direction:column}
  .palette{flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:center}
  .palette h2{display:none}
  .pal{flex:none}
  .stage{height:62vh;min-height:380px;flex:none}
  #mainPlan .palette{flex-direction:column;overflow:visible;align-items:stretch;order:3}
  #mainPlan .stage{order:1;height:68vh}
  #mainPlan .side{order:2}
  .tab{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tabs{flex:1 1 100%;order:5}
  .side{overflow:visible}
}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.chip,.pal{transition:border-color .12s}}
[hidden]{display:none!important}
html{color-scheme:light dark}
</style>
</head>

    <symbol id="ic-mic" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="17.5" y="4" width="13" height="23" rx="6.5"/><path d="M11 22a13 13 0 0 0 26 0M24 35v8M16 43h16"/></g></symbol>
    <symbol id="ic-network" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="27" width="38" height="13" rx="2"/><circle cx="13" cy="33.5" r="1.7" fill="currentColor"/><circle cx="20" cy="33.5" r="1.7" fill="currentColor"/><path d="M13 27L9 11M35 27l4-16M24 27V9"/></g></symbol>

    <symbol id="ic-frame" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="38" height="32" rx="4" stroke-dasharray="5 4"/><path d="M5 17h38"/></g></symbol>

  </defs>
</svg>

<div class="app">
  <header>
    <h1>機材配線図</h1>
    <div class="seg" role="group" aria-label="表示の切り替え"><button type="button" id="vWire" aria-pressed="true">配線図</button><button type="button" id="vPlan" aria-pressed="false">会場レイアウト</button></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="シート"></div>
    <button class="btn" id="undo" type="button">元に戻す</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var NW=156,HH=40,RH=21,PADY=7;
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

var NODE_TYPES=[
 {id:'camera',label:'カメラ'},{id:'switcher',label:'スイッチャー'},{id:'pc',label:'PC / OBS'},
 {id:'monitor',label:'モニター'},{id:'recorder',label:'レコーダー'},{id:'audio',label:'ミキサー'},
 {id:'mic',label:'マイク'},{id:'network',label:'ルーター / HUB'},{id:'power',label:'電源タップ'},{id:'other',label:'その他'}
];
var NT={};NODE_TYPES.forEach(function(t){NT[t.id]=t});
var CABLE_TYPES=[
 {id:'sdi',label:'SDI',short:'SDI',dash:''},
 {id:'hdmi',label:'HDMI',short:'HDMI',dash:'10 4'},
 {id:'lan',label:'LAN',short:'LAN',dash:'2 5'},
 {id:'xlr',label:'XLR(キャノン・音声)',short:'XLR',dash:'14 4 2 4'},
 {id:'power',label:'電源',short:'電源',dash:'6 6'},
 {id:'other',label:'その他',short:'他',dash:'1 0'}
];
var CT={};CABLE_TYPES.forEach(function(t){CT[t.id]=t});
function tcls(t){return 't-'+(CT[t]?t:'other')}

/* ---------- default terminals per equipment type ---------- */
function P(dir,type,label){return {id:uid(),dir:dir,type:type,label:label}}
function defaultPorts(type){
  switch(type){
    case 'camera':return [P('in','xlr','XLR IN'),P('in','power','電源'),P('out','sdi','SDI OUT'),P('out','hdmi','HDMI OUT')];
    case 'switcher':return [P('in','sdi','SDI 1'),P('in','sdi','SDI 2'),P('in','sdi','SDI 3'),P('in','sdi','SDI 4'),
      P('in','hdmi','HDMI 5'),P('in','hdmi','HDMI 6'),P('in','hdmi','HDMI 7'),P('in','hdmi','HDMI 8'),P('in','power','電源'),
      P('out','hdmi','HDMI PGM'),P('out','hdmi','HDMI MV'),P('out','hdmi','HDMI 返し1'),P('out','hdmi','HDMI 返し2'),P('out','lan','LAN')];
    case 'pc':return [P('in','hdmi','HDMI(取込)'),P('in','power','電源'),P('out','lan','LAN'),P('out','hdmi','HDMI OUT')];
    case 'monitor':return [P('in','hdmi','HDMI IN'),P('in','sdi','SDI IN'),P('in','power','電源')];
    case 'recorder':return [P('in','hdmi','HDMI IN'),P('in','sdi','SDI IN'),P('in','power','電源'),P('out','hdmi','HDMI OUT')];
    case 'audio':return [P('in','xlr','CH1'),P('in','xlr','CH2'),P('in','xlr','CH3'),P('in','xlr','CH4'),P('in','power','電源'),P('out','xlr','OUT L'),P('out','xlr','OUT R')];
    case 'mic':return [P('out','xlr','XLR OUT')];
    case 'network':return [P('in','power','電源'),P('in','lan','WAN'),P('out','lan','LAN 1'),P('out','lan','LAN 2'),P('out','lan','LAN 3'),P('out','lan','LAN 4')];
    case 'power':return [P('in','power','AC IN'),P('out','power','OUT 1'),P('out','power','OUT 2'),P('out','power','OUT 3'),P('out','power','OUT 4'),P('out','power','OUT 5'),P('out','power','OUT 6')];
    default:return [P('in','other','IN'),P('out','other','OUT')];
  }
}

var state=null, sel=null, viewMode='wire', planSel=null, planFit=true;
var view={x:40,y:60,k:1};
var undoStack=[], touched=false;

/* ---------- sample: 8 cameras ---------- */
function sampleSheet(){
  var nodes=[],cables=[];
  function node(type,x,y,name,note){var n={id:uid(),type:type,x:x,y:y,name:name,note:note||'',ports:defaultPorts(type)};nodes.push(n);return n}
  function port(n,dir,label){return n.ports.find(function(p){return p.dir===dir&&p.label===label})}
  function wire(a,pa,b,pb,len,memo){cables.push({id:uid(),from:{n:a.id,p:pa.id},to:{n:b.id,p:pb.id},len:len||'',memo:memo||''})}
  var mixer=node('audio',-250,40,'ミキサー','音声');
  var cams=[];
  for(var i=0;i<8;i++){
    var nm=i===0?'NX800':(i===1?'Z200':'カメラ'+(i+1));
    cams.push(node('camera',0,[0,104,272,440,544,648,752,856][i],nm,'Cam'+(i+1)));
  }
  var sw=node('switcher',380,230,'スイッチャー','');
  var mon=node('monitor',700,120,'モニター','確認用');
  var pc=node('pc',700,300,'PC (OBS)','配信');
  var rt=node('network',960,300,'ルーター','');
  var tap=node('power',150,860,'電源タップ','');
  wire(mixer,port(mixer,'out','OUT L'),cams[0],port(cams[0],'in','XLR IN'),'15m','音声');
  wire(mixer,port(mixer,'out','OUT R'),cams[1],port(cams[1],'in','XLR IN'),'10m','音声');
  for(var j=0;j<4;j++)wire(cams[j],port(cams[j],'out','SDI OUT'),sw,port(sw,'in','SDI '+(j+1)),['10m','20m','20m','20m'][j],'Cam'+(j+1));
  for(var k=4;k<8;k++)wire(cams[k],port(cams[k],'out','HDMI OUT'),sw,port(sw,'in','HDMI '+(k+1)),['10m','15m','15m','15m'][k-4],'Cam'+(k+1));
  wire(sw,port(sw,'out','HDMI PGM'),pc,port(pc,'in','HDMI(取込)'),'10m','PGM');
  wire(sw,port(sw,'out','HDMI MV'),mon,port(mon,'in','HDMI IN'),'10m','マルチビュー');
  wire(pc,port(pc,'out','LAN'),rt,port(rt,'in','WAN'),'10m','');
  wire(tap,port(tap,'out','OUT 1'),sw,port(sw,'in','電源'),'','');
  var k1=node('monitor',700,-130,'返しモニター1','カメラマン用');
  var k2=node('monitor',960,60,'返しモニター2','カメラマン用');
  k1.ports=[P('in','hdmi','HDMI IN'),P('in','power','電源')];k2.ports=[P('in','hdmi','HDMI IN'),P('in','power','電源')];
  wire(sw,port(sw,'out','HDMI 返し1'),k1,port(k1,'in','HDMI IN'),'15m','返し');
  wire(sw,port(sw,'out','HDMI 返し2'),k2,port(k2,'in','HDMI IN'),'15m','返し');
  var sh={id:uid(),name:'サンプル(8カメ)',nodes:nodes,cables:cables};
  ensurePlan(sh);
  return sh;
}
function newState(){var s=sampleSheet();return {sheets:[s],active:s.id}}
function cur(){return state.sheets.find(function(s){return s.id===state.active})||state.sheets[0]}
function nodeById(sh,id){return sh.nodes.find(function(n){return n.id===id})}
function cableById(sh,id){return sh.cables.find(function(c){return c.id===id})}
function portOf(n,pid){return n&&n.ports.find(function(p){return p.id===pid})}

/* ---------- geometry ---------- */
function childOf(sh,n){var pr=sh.pairs;if(!pr)return null;for(var k in pr){if(pr[k]===n.id){var c=nodeById(sh,k);if(c)return c}}return null}
function hostOf(sh,n){var pr=sh.pairs,h=pr&&pr[n.id];return h?(nodeById(sh,h)||null):null}
function isChild(sh,n){return !!hostOf(sh,n)}
function groupById(sh,id){return (sh.groups||[]).find(function(g){return g.id===id})}
function layout(sh,n){
  var secs=[{node:n}],c=childOf(sh,n);if(c)secs.push({node:c});
  var y=HH+PADY,m={},seps=[];
  secs.forEach(function(sec,si){
    if(si>0){seps.push({y:y,node:sec.node});y+=RH}
    var ins=0,outs=0;
    sec.node.ports.forEach(function(p){
      var i=p.dir==='in'?ins++:outs++;
      var rx=p.dir==='in'?0:NW,ry=y+i*RH+RH/2;
      m[p.id]={x:n.x+rx,y:n.y+ry,rx:rx,ry:ry,dir:p.dir,port:p,node:sec.node};
    });
    y+=Math.max(ins,outs,1)*RH;
  });
  return {h:y+PADY,sockets:m,seps:seps,child:c};
}
function nodeH(n){return layout(cur(),n).h}
function sockets(n){return layout(cur(),n).sockets}
function sockOf(sh,nid,pid){var n=nodeById(sh,nid);if(!n)return null;var h=hostOf(sh,n)||n;return layout(sh,h).sockets[pid]||null}
function ctypeOf(sh,c){
  var a=nodeById(sh,c.from.n),b=nodeById(sh,c.to.n);
  var pa=portOf(a,c.from.p),pb=portOf(b,c.to.p);
  var ta=pa?pa.type:'other',tb=pb?pb.type:'other';
  return ta!=='other'?ta:tb;
}
function compat(pa,pb){return pa.type===pb.type||pa.type==='other'||pb.type==='other'}
function curve(p0,dir0,p1,dir1){
  var n0=dir0==='in'?-1:1,n1=dir1==='in'?-1:1;
  var d=Math.max(40,Math.abs(p1.x-p0.x)*0.5);
  var c1={x:p0.x+n0*d,y:p0.y},c2={x:p1.x+n1*d,y:p1.y};
  return {p0:p0,c1:c1,c2:c2,p1:p1,
    d:'M'+p0.x+' '+p0.y+' C'+c1.x+' '+c1.y+' '+c2.x+' '+c2.y+' '+p1.x+' '+p1.y,
    mid:{x:(p0.x+3*c1.x+3*c2.x+p1.x)/8,y:(p0.y+3*c1.y+3*c2.y+p1.y)/8}};
}
function bez(cv,t){
  var u=1-t;
  return {x:u*u*u*cv.p0.x+3*u*u*t*cv.c1.x+3*u*t*t*cv.c2.x+t*t*t*cv.p1.x,
          y:u*u*u*cv.p0.y+3*u*u*t*cv.c1.y+3*u*t*t*cv.c2.y+t*t*t*cv.p1.y};
}
function computeCables(sh){
  var out=[];
  sh.cables.forEach(function(c){
    var sa=sockOf(sh,c.from.n,c.from.p),sb=sockOf(sh,c.to.n,c.to.p);if(!sa||!sb)return;
    var cv=curve(sa,sa.dir,sb,sb.dir);cv.c=c;cv.type=ctypeOf(sh,c);out.push(cv);
  });
  return out;
}
function socketAt(sh,p,k){
  var r=Math.min(22,Math.max(11,15/k)),best=null,bd=1e9;
  sh.nodes.forEach(function(n){
    if(isChild(sh,n))return;
    var m=layout(sh,n).sockets;
    Object.keys(m).forEach(function(id){
      var s=m[id],d=Math.hypot(s.x-p.x,s.y-p.y);
      if(d<=r&&d<bd){bd=d;best=s}
    });
  });
  return best;
}
function usedMap(sh){
  var u={};sh.cables.forEach(function(c){u[c.from.n+'|'+c.from.p]=c;u[c.to.n+'|'+c.to.p]=c});return u;
}


/* ---------- plan data helpers ---------- */
var SAMPLE_NAME='サンプル(8カメ)';
var SAMPLE_POS={'ミキサー':[5.5,12.6],'NX800':[12,7],'Z200':[6,7],'カメラ3':[18,7],'カメラ4':[3,3.6],'カメラ5':[21,3.6],'カメラ6':[8.5,3.2],'カメラ7':[15.5,3.2],'カメラ8':[12,4.4],
  'スイッチャー':[12,11],'モニター':[8.6,11],'PC (OBS)':[15.4,11],'ルーター':[18,12.6],'電源タップ':[12,12.9],'返しモニター1':[5.5,9],'返しモニター2':[18.5,9]};
function defaultPlan(){return {w:9,d:7,room:'教室',doors:[],placed:{},slack:2,route:'L',labels:false}}
function placeByName(sh){
  sh.nodes.forEach(function(n){var q=SAMPLE_POS[n.name];if(q&&!sh.plan.placed[n.id])sh.plan.placed[n.id]={x:q[0],y:q[1]}});
}
function ensurePlan(sh){
  var fresh=!sh.plan,hadPairs=!!sh.pairs;
  if(!sh.pairs)sh.pairs={};
  if(!Array.isArray(sh.groups))sh.groups=[];
  if(fresh)sh.plan=defaultPlan();
  var p=sh.plan;
  if(!(p.w>0))p.w=9;if(!(p.d>0))p.d=7;
  if(!Array.isArray(p.doors))p.doors=[];if(!p.placed)p.placed={};
  if(typeof p.slack!=='number')p.slack=2;if(p.route!=='S'&&p.route!=='L')p.route='L';if(typeof p.labels!=='boolean')p.labels=false;
  if(p.attach){
    var mv=false;for(var k in p.attach){if(!sh.pairs[k]){sh.pairs[k]=p.attach[k];mv=true}}
    delete p.attach;if(mv)resolveAllWire(sh);
  }
  if(fresh&&sh.name===SAMPLE_NAME){
    p.w=24;p.d=14;p.room='体育館';
    p.doors=[{id:uid(),wall:'bottom',pos:6,width:2},{id:uid(),wall:'bottom',pos:19,width:2},{id:uid(),wall:'right',pos:9,width:1.2}];
  }
  if(!p.aim||typeof p.aim!=='object')p.aim={};
  if(!p.via||typeof p.via!=='object')p.via={};
  if(!Array.isArray(p.zones)){
    p.zones=[];
    if(sh.name===SAMPLE_NAME&&p.w===24&&p.d===14){
      placeByName(sh);
      p.zones.push({id:uid(),kind:'stage',name:'ステージ',x:7,y:0,w:10,d:2.6,h:0.8});
      p.zones.push({id:uid(),kind:'seats',name:'客席',x:2,y:5.4,w:20,d:4.6,h:0});
      var c8=sh.nodes.find(function(n){return n.name==='カメラ8'&&n.type==='camera'});
      if(c8&&p.placed[c8.id]&&p.placed[c8.id].x===12&&p.placed[c8.id].y===1.8){p.placed[c8.id]={x:12,y:4.4}}
      var fovs={'NX800':30,'Z200':40,'カメラ3':40,'カメラ4':50,'カメラ5':50,'カメラ6':60,'カメラ7':60,'カメラ8':70};
      sh.nodes.forEach(function(n){
        var q=n.type==='camera'&&p.placed[n.id];if(!q||!fovs[n.name]||p.aim[n.id])return;
        var dx=12-q.x,dy=1.3-q.y,dist=Math.hypot(dx,dy);
        p.aim[n.id]={ang:(Math.round(Math.atan2(dx,-dy)*180/Math.PI/5)*5+360)%360,fov:fovs[n.name],range:Math.round((dist*1.05+1)*2)/2};
      });
    }
  }
  if(sh.name===SAMPLE_NAME){
    placeByName(sh);
    if(!hadPairs&&!Object.keys(sh.pairs).length){
      [['返しモニター1','Z200'],['返しモニター2','カメラ3']].forEach(function(pr){
        var m=sh.nodes.find(function(n){return n.name===pr[0]}),c=sh.nodes.find(function(n){return n.name===pr[1]&&n.type==='camera'});
        if(m&&c){sh.pairs[m.id]=c.id;if(p.placed[c.id])p.placed[m.id]={x:p.placed[c.id].x,y:p.placed[c.id].y}}
      });
    }
  }
}
function upgradeSample(sh){
  if(sh.name!==SAMPLE_NAME)return;
  var sw=sh.nodes.find(function(n){return n.type==='switcher'&&n.name==='スイッチャー'});
  if(!sw||sh.nodes.some(function(n){return n.name==='返しモニター1'}))return;
  var add=function(label){
    var q=sw.ports.find(function(x){return x.dir==='out'&&x.label===label});
    if(!q){q=P('out','hdmi',label);sw.ports.push(q)}return q;
  };
  [['返しモニター1',-130,700],['返しモニター2',60,960]].forEach(function(d,i){
    var m={id:uid(),type:'monitor',x:d[2],y:d[1],name:d[0],note:'カメラマン用',ports:defaultPorts('monitor')};
    sh.nodes.push(m);
    var o=add('HDMI 返し'+(i+1));
    sh.cables.push({id:uid(),from:{n:sw.id,p:o.id},to:{n:m.id,p:m.ports[0].id},len:'15m',memo:'返し'});
  });
}

/* ---------- persistence ---------- */
var dbRef=null, writing=false, pendingWrite=false, saveTimer=null, localSavedAt=0;
var LS='wiring-diagram-v1';
var lastStat='loading';
function setStatus(k){
  lastStat=k;
  var t={loading:'読み込み中…',saving:'保存中…',saved:'保存済み',local:'この端末に保存'}[k]||'';
  $('#status').textContent=t;
}
function snapshot(){return JSON.stringify({sheets:state.sheets,active:state.active})}
function changed(){touched=true;setStatus('saving');clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
function flush(){
  if(writing){pendingWrite=true;return}
  var payload={json:snapshot(),savedAt:Date.now()};
  try{localStorage.setItem(LS,JSON.stringify(payload));localSavedAt=payload.savedAt}catch(e){}
  if(!dbRef){setStatus('local');return}
  writing=true;
  dbRef.set(payload).then(function(){setStatus('saved')},function(){setStatus('local')}).then(function(){
    writing=false;if(pendingWrite){pendingWrite=false;flush()}
  });
}
function freePort(cables,n,dir,t){
  var used={};cables.forEach(function(c){used[c.from.n+'|'+c.from.p]=1;used[c.to.n+'|'+c.to.p]=1});
  var p=n.ports.find(function(q){return q.dir===dir&&q.type===t&&!used[n.id+'|'+q.id]});
  if(!p){p={id:uid(),dir:dir,type:t,label:CT[t].short+(dir==='in'?' IN':' OUT')};n.ports.push(p)}
  return p;
}
function migrate(o){
  // 旧サンプル(端子なしの8機材)は新しい8カメサンプルに置き換える
  if(o.sheets.length===1){
    var s0=o.sheets[0];
    if(s0.name==='サンプル(例)'&&s0.nodes.length===8&&s0.nodes.every(function(n){return !n.ports})){
      var ns=sampleSheet();o.sheets=[ns];o.active=ns.id;return o;
    }
  }
  o.sheets.forEach(function(sh){
    sh.nodes.forEach(function(n){if(!Array.isArray(n.ports))n.ports=defaultPorts(n.type)});
    var out=[];
    sh.cables.forEach(function(c){
      if(c.from&&typeof c.from==='object'){out.push(c);return}
      var a=nodeById(sh,c.from),b=nodeById(sh,c.to);if(!a||!b)return;
      var t=CT[c.type]?c.type:'other';
      var pa=freePort(out,a,'out',t);
      out.push({id:'tmp',from:{n:a.id,p:pa.id},to:{n:b.id,p:'x'},len:'',memo:''});
      var pb=freePort(out,b,'in',t);
      out.pop();
      out.push({id:c.id,from:{n:a.id,p:pa.id},to:{n:b.id,p:pb.id},len:c.len||'',memo:c.memo||''});
    });
    sh.cables=out.filter(function(c){
      var a=nodeById(sh,c.from.n),b=nodeById(sh,c.to.n);
      return a&&b&&portOf(a,c.from.p)&&portOf(b,c.to.p);
    });
    upgradeSample(sh);
    ensurePlan(sh);
  });
  return o;
}
function parseState(json){
  try{var o=JSON.parse(json);if(o&&Array.isArray(o.sheets)&&o.sheets.length)return migrate(o)}catch(e){}
  return null;
}
function loadLocal(){
  try{var raw=localStorage.getItem(LS);if(raw){var p=JSON.parse(raw);var s=parseState(p.json);if(s){localSavedAt=p.savedAt||0;return s}}}catch(e){}
  return null;
}
function initDb(){

  var done=false;

  window.claude.use('db').then(function(db){
    if(!db){done=true;clearTimeout(timer);setStatus('local');return}
    dbRef=db.doc('wiring/main');
    return dbRef.get().then(function(snap){
      done=true;clearTimeout(timer);
      if(snap.exists){
        var d=snap.data()||{};var s=parseState(d.json);
        if(s&&!touched&&(d.savedAt||0)>=localSavedAt){state=s;sel=null;fitView();renderAll()}
      }

function overlapsList(sh,list,x,y,h){return list.some(function(o){var oh=layout(sh,o).h;return x<o.x+NW+16&&x+NW+16>o.x&&y<o.y+oh+16&&y+h+16>o.y})}
function freeSpot(sh,list,n){
  var h=layout(sh,n).h;
  if(!overlapsList(sh,list,n.x,n.y,h))return null;
  var step=12;
  for(var r=1;r<=70;r++){
    var c=[];for(var dx=-r;dx<=r;dx++)for(var dy=-r;dy<=r;dy++){if(Math.max(Math.abs(dx),Math.abs(dy))===r)c.push([dx,dy])}
    c.sort(function(a,b){return a[0]*a[0]+a[1]*a[1]-b[0]*b[0]-b[1]*b[1]});
    for(var i=0;i<c.length;i++){var x=n.x+c[i][0]*step,y=n.y+c[i][1]*step;if(!overlapsList(sh,list,x,y,h))return {x:x,y:y}}
  }
  return null;
}
function resolveOne(sh,n){
  var list=sh.nodes.filter(function(o){return o!==n&&!isChild(sh,o)});
  var s=freeSpot(sh,list,n);if(s){n.x=s.x;n.y=s.y;return true}return false;
}
function resolveAllWire(sh){
  var vis=sh.nodes.filter(function(n){return !isChild(sh,n)}).sort(function(a,b){return a.y-b.y||a.x-b.x});

  vis.forEach(function(n){var s=freeSpot(sh,fixed,n);if(s){n.x=s.x;n.y=s.y;moved=true}fixed.push(n)});
  return moved;
}
function findWireMerge(sh,n){
  var L=layout(sh,n),best=null,bd=1e9;
  sh.nodes.forEach(function(o){
    if(o===n||isChild(sh,o))return;
    var ok=false;
    if(n.type==='camera'&&isKaeshi(o)&&!childOf(sh,n))ok=true;
    if(isKaeshi(n)&&o.type==='camera'&&!childOf(sh,o))ok=true;
    if(!ok)return;
    var oh=layout(sh,o).h;
    var dx=Math.max(0,Math.max(o.x-(n.x+NW),n.x-(o.x+NW))),dy=Math.max(0,Math.max(o.y-(n.y+L.h),n.y-(o.y+oh)));
    var d=Math.hypot(dx,dy);if(d<=28&&d<bd){bd=d;best=o.id}
  });
  return best;
}

function deleteSel(){
  if(!sel)return;pushUndo();var sh=cur();
  if(sel.kind==='node'){
    var id=sel.id;
    Object.keys(sh.pairs||{}).forEach(function(k){if(k===id||sh.pairs[k]===id)delete sh.pairs[k]});
    sh.nodes=sh.nodes.filter(function(n){return n.id!==id});
    sh.cables=sh.cables.filter(function(c){return c.from.n!==id&&c.to.n!==id});
  }else if(sel.kind==='group'){sh.groups=(sh.groups||[]).filter(function(g){return g.id!==sel.id})}
  else sh.cables=sh.cables.filter(function(c){return c.id!==sel.id});
  sel=null;renderAll();changed();
}
function setSel(s){sel=s;render();renderSide()}

/* ---------- pointer interaction ---------- */
var ptrs=new Map(),mode=null,drag=null,pan=null,pinch=null,pend=null,gd=null;
function parseSock(str){var a=str.split('|');return {n:a[0],p:a[1]}}
function startConn(fixed,cable,end,p){
  conn={fixed:fixed,cable:cable,end:end,x:p.x,y:p.y,hover:null};mode='conn';render();
}
svg.addEventListener('pointerdown',function(e){
  if(e.button!==undefined&&e.button>0)return;
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    var pts=Array.from(ptrs.values());
    pinch={d:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1,k:view.k,mx:(pts[0].x+pts[1].x)/2,my:(pts[0].y+pts[1].y)/2,vx:view.x,vy:view.y};
    mode='pinch';conn=null;drag=null;pan=null;pend=null;gd=null;wcand=null;render();return;
  }
  var t=e.target,sh=cur();
  var sk=t.closest&&t.closest('[data-socket]');
  var nEl=t.closest&&t.closest('[data-node]');
  var cEl=t.closest&&t.closest('[data-cable]');
  var rEl=t.closest&&t.closest('[data-gres]');
  var bEl=t.closest&&t.closest('[data-gbar]');
  var w=toWorld(e.clientX,e.clientY);
  if(sk){
    var s=parseSock(sk.getAttribute('data-socket'));
    var cab=usedMap(sh)[s.n+'|'+s.p];
    e.preventDefault();
    if(cab){mode='sockpend';pend={cable:cab,sock:s,sx:e.clientX,sy:e.clientY}}
    else{setSel({kind:'node',id:s.n});startConn(s,null,null,w)}
  }else if(nEl){
    var id=nEl.getAttribute('data-node'),n=nodeById(sh,id);
    mode='drag';drag={id:id,dx:w.x-n.x,dy:w.y-n.y,moved:false};
    if(!(sel&&sel.kind==='node'&&sel.id===id))setSel({kind:'node',id:id});
  }else if(rEl){
    var g=groupById(sh,rEl.getAttribute('data-gres'));
    mode='gres';gd={id:g.id,w:g.w,h:g.h,sx:w.x,sy:w.y,moved:false};
    if(!(sel&&sel.kind==='group'&&sel.id===g.id))setSel({kind:'group',id:g.id});
  }else if(bEl){
    var g2=groupById(sh,bEl.getAttribute('data-gbar'));
    mode='gdrag';
    gd={id:g2.id,ox:g2.x,oy:g2.y,sx:w.x,sy:w.y,moved:false,members:groupMembers(sh,g2).map(function(m){return {n:m,x:m.x,y:m.y}})};
    if(!(sel&&sel.kind==='group'&&sel.id===g2.id))setSel({kind:'group',id:g2.id});
  }else if(cEl){
    setSel({kind:'cable',id:cEl.getAttribute('data-cable')});mode=null;
  }else if(e.altKey||e.ctrlKey||e.metaKey){
    mode='cut';cutLine={x0:w.x,y0:w.y,x1:w.x,y1:w.y};render();
  }else{
    mode='pan';pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};svg.classList.add('panning');
  }
});
svg.addEventListener('pointermove',function(e){
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mode==='pinch'&&pinch&&ptrs.size>=2){
    var pts=Array.from(ptrs.values());
    var d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1;
    var k=Math.min(2.5,Math.max(0.15,pinch.k*d/pinch.d));
    var r=svg.getBoundingClientRect();var px=pinch.mx-r.left,py=pinch.my-r.top;var real=k/pinch.k;
    var cx=(pts[0].x+pts[1].x)/2-pinch.mx,cy=(pts[0].y+pts[1].y)/2-pinch.my;
    view.k=k;view.x=px-(px-pinch.vx)*real+cx;view.y=py-(py-pinch.vy)*real+cy;applyView();return;
  }
  var sh=cur();
  if(mode==='sockpend'&&pend){
    if(Math.hypot(e.clientX-pend.sx,e.clientY-pend.sy)>4){
      var c=pend.cable;
      var end=(c.from.n===pend.sock.n&&c.from.p===pend.sock.p)?'from':'to';
      var fixed=end==='from'?{n:c.to.n,p:c.to.p}:{n:c.from.n,p:c.from.p};
      pushUndo();
      sh.cables=sh.cables.filter(function(q){return q.id!==c.id});
      var w0=toWorld(e.clientX,e.clientY);
      sel=null;
      startConn(fixed,c,end,w0);renderSide();pend=null;
    }
    return;
  }
  if(mode==='drag'&&drag){
    var n=nodeById(sh,drag.id);if(!n)return;
    var p=toWorld(e.clientX,e.clientY);
    var nx=Math.round((p.x-drag.dx)/6)*6,ny=Math.round((p.y-drag.dy)/6)*6;
    if(nx!==n.x||ny!==n.y){
      if(!drag.moved){pushUndo();drag.moved=true}
      n.x=nx;n.y=ny;wcand=findWireMerge(sh,n);render();
    }
  }else if(mode==='gdrag'&&gd){
    var g=groupById(sh,gd.id);if(!g)return;
    var q=toWorld(e.clientX,e.clientY);
    var dx=Math.round((q.x-gd.sx)/6)*6,dy=Math.round((q.y-gd.sy)/6)*6;
    if(dx||dy){
      if(!gd.moved){pushUndo();gd.moved=true}
      g.x=gd.ox+dx;g.y=gd.oy+dy;gd.members.forEach(function(m){m.n.x=m.x+dx;m.n.y=m.y+dy});render();
    }
  }else if(mode==='gres'&&gd){
    var g3=groupById(sh,gd.id);if(!g3)return;
    var q3=toWorld(e.clientX,e.clientY);
    var nw=Math.max(140,Math.round((gd.w+q3.x-gd.sx)/6)*6),nh=Math.max(90,Math.round((gd.h+q3.y-gd.sy)/6)*6);
    if(nw!==g3.w||nh!==g3.h){if(!gd.moved){pushUndo();gd.moved=true}g3.w=nw;g3.h=nh;render()}
  }else if(mode==='conn'&&conn){
    var q2=toWorld(e.clientX,e.clientY);conn.x=q2.x;conn.y=q2.y;
    var h=socketAt(sh,q2,view.k);
    conn.hover=h&&h.node.id!==conn.fixed.n?h:null;render();
  }else if(mode==='cut'&&cutLine){
    var q4=toWorld(e.clientX,e.clientY);cutLine.x1=q4.x;cutLine.y1=q4.y;render();
  }else if(mode==='pan'&&pan){
    var ddx=e.clientX-pan.x,ddy=e.clientY-pan.y;
    if(Math.abs(ddx)+Math.abs(ddy)>3)pan.moved=true;
    view.x=pan.vx+ddx;view.y=pan.vy+ddy;applyView();
  }
});
function segCross(ax,ay,bx,by,cx,cy,dx,dy){
  var d1=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax),d2=(bx-ax)*(dy-ay)-(by-ay)*(dx-ax);
  var d3=(dx-cx)*(ay-cy)-(dy-cy)*(ax-cx),d4=(dx-cx)*(by-cy)-(dy-cy)*(bx-cx);
  return (d1*d2<0)&&(d3*d4<0);
}
function endPointer(e){
  var had=ptrs.delete(e.pointerId);
  if(!had)return;
  var cancel=e.type==='pointercancel';
  if(mode==='pinch'){if(ptrs.size<2){mode=null;pinch=null}return}
  var sh=cur();
  if(mode==='sockpend'&&pend){
    if(!cancel)setSel({kind:'cable',id:pend.cable.id});
    pend=null;
  }else if(mode==='drag'&&drag){
    if(drag.moved){
      var n=nodeById(sh,drag.id),cd=wcand;wcand=null;
      if(n){
        if(cd){var cam=wireMerge(sh,drag.id,cd);if(cam)sel={kind:'node',id:cam.id}}
      }
      changed();renderAll();
    }
    drag=null;
  }else if(mode==='gdrag'||mode==='gres'){
    if(gd&&gd.moved){changed();renderSide()}
    gd=null;
  }else if(mode==='conn'&&conn){
    var c0=conn;conn=null;
    var p=toWorld(e.clientX,e.clientY);
    var target=cancel?null:socketAt(sh,p,view.k);
    var fnode=nodeById(sh,c0.fixed.n),fport=portOf(fnode,c0.fixed.p);
    var ok=target&&target.node.id!==c0.fixed.n&&fport&&compat(fport,target.port);
    if(ok){
      var key=target.node.id+'|'+target.port.id,old=usedMap(sh)[key];
      if(old)sh.cables=sh.cables.filter(function(q){return q.id!==old.id});
      var tgt={n:target.node.id,p:target.port.id};
      var nc=c0.cable?{id:c0.cable.id,len:c0.cable.len,memo:c0.cable.memo}:{id:uid(),len:'',memo:''};
      if(c0.end==='from'){nc.from=tgt;nc.to=c0.fixed}else{nc.from=c0.fixed;nc.to=tgt}
      sh.cables.push(nc);
      if(!c0.cable)pushUndoBefore(nc.id);
      sel={kind:'cable',id:nc.id};changed();
    }else if(c0.cable){
      if(cancel){sh.cables.push(c0.cable);undoStack.pop();$('#undo').disabled=undoStack.length===0}
      else{sel=null;changed()}
    }
    renderAll();
  }else if(mode==='cut'&&cutLine){
    var L=cutLine;cutLine=null;
    if(!cancel){
      var hits=[];
      computeCables(sh).forEach(function(cv){
        var prev=bez(cv,0);
        for(var i=1;i<=28;i++){
          var cu=bez(cv,i/28);
          if(segCross(L.x0,L.y0,L.x1,L.y1,prev.x,prev.y,cu.x,cu.y)){hits.push(cv.c.id);break}
          prev=cu;
        }
      });
      if(hits.length){pushUndo();sh.cables=sh.cables.filter(function(c){return hits.indexOf(c.id)<0});sel=null;changed()}
    }
    renderAll();
  }else if(mode==='pan'&&pan){
    svg.classList.remove('panning');
    if(!pan.moved&&!cancel&&sel)setSel(null);
    pan=null;
  }
  mode=null;
}
function pushUndoBefore(newId){
  var o=JSON.parse(snapshot());
  var sh=o.sheets.find(function(s){return s.id===state.active});
  if(sh)sh.cables=sh.cables.filter(function(c){return c.id!==newId});
  undoStack.push(JSON.stringify(o));if(undoStack.length>40)undoStack.shift();$('#undo').disabled=false;
}
svg.addEventListener('pointerup',endPointer);
svg.addEventListener('pointercancel',endPointer);
svg.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0016))},{passive:false});
function zoomCenter(f){var r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f)}

$('#detachAll').addEventListener('click',function(){

$('#resolve').addEventListener('click',function(){pushUndo();resolveAllWire(cur());renderAll();changed()});
document.addEventListener('keydown',function(e){
  var t=e.target,tag=t&&t.tagName;
  if(e.key==='Escape'&&conn){
    var c0=conn;conn=null;mode=null;
    if(c0.cable){cur().cables.push(c0.cable);undoStack.pop();$('#undo').disabled=undoStack.length===0}
    renderAll();return;
  }

  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}

var STD=[1,1.5,2,3,5,7.5,10,15,20,30,50,100];
var ROOMS=[{n:'教室',w:9,d:7},{n:'小ホール',w:15,d:10},{n:'体育館',w:28,d:15},{n:'正方形(小)',w:10,d:10},{n:'正方形(大)',w:20,d:20},{n:'細長い長方形',w:24,d:8},
  {n:'小宴会場',w:14,d:9},{n:'中宴会場',w:24,d:16},{n:'大宴会場',w:40,d:25},{n:'特大宴会場',w:60,d:30}];
var ZKIND={stage:{label:'ステージ',w:8,d:3,h:0.8},seats:{label:'客席',w:12,d:6,h:0},pillar:{label:'柱',w:0.8,d:0.8,h:0},partition:{label:'間仕切り',w:6,d:0.3,h:0},other:{label:'その他',w:3,d:2,h:0}};
var WALLS=[{id:'top',label:'上'},{id:'right',label:'右'},{id:'bottom',label:'下'},{id:'left',label:'左'}];
var pv=$('#pv'),pview={x:60,y:60,k:20};
function stdLen(x){for(var i=0;i<STD.length;i++){if(x<=STD[i]+1e-9)return STD[i]}return Math.ceil(x/10)*10}
function fm(x){return (Math.round(x*10)/10).toString()}
function pl(){var sh=cur();ensurePlan(sh);return sh.plan}
function mx(x){return pview.x+x*pview.k}
function my(y){return pview.y+y*pview.k}
function pToM(cx,cy){var r=pv.getBoundingClientRect();return {x:(cx-r.left-pview.x)/pview.k,y:(cy-r.top-pview.y)/pview.k}}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function snapM(v){return Math.round(v*4)/4}
function fitPlan(){
  var r=pv.getBoundingClientRect();if(!r.width)return false;
  var p=pl(),padL=58,padT=52,pad=30;
  pview.k=clamp(Math.min((r.width-padL-pad)/p.w,(r.height-padT-pad)/p.d),4,70);
  pview.x=padL+((r.width-padL-pad)-p.w*pview.k)/2;
  pview.y=padT+((r.height-padT-pad)-p.d*pview.k)/2;
  return true;
}
function wallPt(p,wall,pos){
  if(wall==='top')return {x:pos,y:0,tx:1,ty:0,nx:0,ny:1};
  if(wall==='bottom')return {x:pos,y:p.d,tx:1,ty:0,nx:0,ny:-1};
  if(wall==='left')return {x:0,y:pos,tx:0,ty:1,nx:1,ny:0};
  return {x:p.w,y:pos,tx:0,ty:1,nx:-1,ny:0};
}
function wallLen(p,wall){return wall==='top'||wall==='bottom'?p.w:p.d}
function zoneAt(p,q){
  var h=0;
  (p.zones||[]).forEach(function(z){
    if(z.kind==='stage'&&q.x>=z.x&&q.x<=z.x+z.w&&q.y>=z.y&&q.y<=z.y+z.d)h=Math.max(h,z.h||0);
  });
  return h;
}
function legPts(P,Q,mode){
  if(mode==='S')return [P,Q];
  var mid=(P.x+Q.x)/2;return [P,{x:mid,y:P.y},{x:mid,y:Q.y},Q];
}
function polyLen(pts){var t=0;for(var i=1;i<pts.length;i++)t+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);return t}
function routePts(p,cid,a,b){
  var via=(p.via&&p.via[cid])||[],anc=[a].concat(via,[b]),out=[a];
  for(var i=1;i<anc.length;i++){var l=legPts(anc[i-1],anc[i],p.route);for(var j=1;j<l.length;j++)out.push(l[j])}
  return out;
}
function pointAlong(pts,frac){
  var tot=polyLen(pts),want=tot*frac,acc=0;
  for(var i=1;i<pts.length;i++){
    var d=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    if(acc+d>=want&&d>0){var t=(want-acc)/d;return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*t,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*t}}
    acc+=d;
  }
  return pts[Math.floor(pts.length/2)];
}
function planCables(sh,p){
  var out=[];
  sh.cables.forEach(function(c){
    var a=posOf(p,c.from.n),b=posOf(p,c.to.n);if(!a||!b)return;
    var pts=routePts(p,c.id,a,b),flat=polyLen(p.route==='S'?pts:pts.map(function(q){return q})),dz=Math.abs(zoneAt(p,a)-zoneAt(p,b));
    // 直角引き回しは縦横の合計(折れ線の長さがそのまま縦横の合計になる)
    var base=flat+dz;
    var need=stdLen(base+p.slack),set=parseFloat(c.len);
    out.push({c:c,a:a,b:b,pts:pts,base:base,dz:dz,need:need,set:set,bad:!isNaN(set)&&set<base+p.slack-1e-9,type:ctypeOf(sh,c),nvia:((p.via&&p.via[c.id])||[]).length});
  });
  return out;
}
function pairs(){var sh=cur();if(!sh.pairs)sh.pairs={};return sh.pairs}
function isKaeshi(n){return !!n&&n.type==='monitor'&&/返し|カメラマン/.test((n.name||'')+(n.note||''))}
function posOf(p,id){var cam=pairs()[id];if(cam&&p.placed[cam])return p.placed[cam];return p.placed[id]}
function monitorOf(p,camId){var pr=pairs(),sh=cur();for(var k in pr){if(pr[k]===camId&&nodeById(sh,k))return k}return null}
function doAttach(p,monId,camId){pairs()[monId]=camId;if(p.placed[camId])p.placed[monId]={x:p.placed[camId].x,y:p.placed[camId].y}}
function doDetach(p,monId){
  var pr=pairs(),cam=pr[monId];delete pr[monId];
  var c=p.placed[cam];
  if(c)p.placed[monId]={x:clamp(snapM(c.x+1.25),0,p.w),y:clamp(snapM(c.y+1),0,p.d)};
}
function findMerge(sh,p,id){
  var n=nodeById(sh,id),q=p.placed[id];if(!n||!q)return null;
  var th=Math.max(1.3,46/pview.k),best=null,bd=1e9,pr=pairs();
  sh.nodes.forEach(function(o){
    var oq=p.placed[o.id];if(!oq||o.id===id)return;
    var ok=false;
    if(n.type==='camera'&&isKaeshi(o)&&!pr[o.id]&&!monitorOf(p,n.id))ok=true;
    if(isKaeshi(n)&&!pr[n.id]&&o.type==='camera'&&!monitorOf(p,o.id))ok=true;
    if(!ok)return;
    var d=Math.hypot(oq.x-q.x,oq.y-q.y);if(d<=th&&d<bd){bd=d;best=o.id}
  });
  return best;
}
function mergePair(sh,p,a,b){
  var na=nodeById(sh,a),nb=nodeById(sh,b);if(!na||!nb)return false;
  var cam=na.type==='camera'?a:b,mon=cam===a?b:a;
  doAttach(p,mon,cam);return cam;
}
function snapPlan(p){
  var o={w:p.w,d:p.d,placed:{},doors:p.doors.map(function(d){return {pos:d.pos}}),
    zones:(p.zones||[]).map(function(z){return {x:z.x,y:z.y,w:z.w,d:z.d}}),via:{}};
  Object.keys(p.via||{}).forEach(function(k){o.via[k]=p.via[k].map(function(q){return {x:q.x,y:q.y}})});
  Object.keys(p.placed).forEach(function(id){o.placed[id]={x:p.placed[id].x,y:p.placed[id].y}});
  return o;
}
function scalePlan(p,base){
  var fx=p.w/base.w,fy=p.d/base.d;
  Object.keys(base.placed).forEach(function(id){
    var q=base.placed[id];p.placed[id]={x:clamp(snapM(q.x*fx),0,p.w),y:clamp(snapM(q.y*fy),0,p.d)};
  });
  p.doors.forEach(function(d,i){
    var b=base.doors[i];if(!b)return;
    var horiz=d.wall==='top'||d.wall==='bottom',f=horiz?fx:fy;
    var L=wallLen(p,d.wall);d.width=Math.min(d.width,L);d.pos=clamp(Math.round(b.pos*f*4)/4,d.width/2,L-d.width/2);
  });
  (p.zones||[]).forEach(function(z,i){
    var b=base.zones&&base.zones[i];if(!b)return;
    z.x=clamp(snapM(b.x*fx),0,p.w-0.25);z.y=clamp(snapM(b.y*fy),0,p.d-0.25);
    z.w=Math.max(0.25,Math.min(snapM(b.w*fx),p.w-z.x));z.d=Math.max(0.25,Math.min(snapM(b.d*fy),p.d-z.y));
  });
  Object.keys(base.via||{}).forEach(function(k){
    if(p.via&&p.via[k])p.via[k]=base.via[k].map(function(q){return {x:clamp(snapM(q.x*fx),0,p.w),y:clamp(snapM(q.y*fy),0,p.d)}});
  });
  var pr=pairs();
  Object.keys(pr).forEach(function(m){var c=p.placed[pr[m]];if(c)p.placed[m]={x:c.x,y:c.y}});
}
function mkBox(p,id){var comp=!!monitorOf(p,id);return {w:comp?122:104,h:comp?72:58}}
function resolvePlan(sh,p,ids){
  var k=pview.k||20,pr=pairs();
  var vis=Object.keys(p.placed).filter(function(id){return nodeById(sh,id)&&!(pr[id]&&p.placed[pr[id]])});
  var movers={};ids.forEach(function(i){movers[i]=1});
  var fixed=vis.filter(function(id){return !movers[id]});
  function hit(id,x,y){
    var a=mkBox(p,id);
    return fixed.some(function(o){var q=p.placed[o],b=mkBox(p,o);return Math.abs(q.x-x)*k<(a.w+b.w)/2&&Math.abs(q.y-y)*k<(a.h+b.h)/2});
  }
  ids.forEach(function(id){
    if(vis.indexOf(id)<0)return;
    var q=p.placed[id];
    if(hit(id,q.x,q.y)){
      var step=Math.max(0.25,10/k),best=null;
      for(var r=1;r<=80&&!best;r++){
        var c=[];for(var dx=-r;dx<=r;dx++)for(var dy=-r;dy<=r;dy++){if(Math.max(Math.abs(dx),Math.abs(dy))===r)c.push([dx,dy])}
        c.sort(function(a,b){return a[0]*a[0]+a[1]*a[1]-b[0]*b[0]-b[1]*b[1]});
        for(var i=0;i<c.length;i++){
          var x=clamp(q.x+c[i][0]*step,0,p.w),y=clamp(q.y+c[i][1]*step,0,p.d);
          if(!hit(id,x,y)){best={x:snapM(x),y:snapM(y)};break}
        }
      }
      if(best){q.x=best.x;q.y=best.y;var mm=monitorOf(p,id);if(mm)p.placed[mm]={x:q.x,y:q.y}}
    }
    fixed.push(id);
  });
}
function nodeName(sh,id){var n=nodeById(sh,id);return n?n.name:'?'}
function cableTitle(sh,c){return nodeName(sh,c.from.n)+' → '+nodeName(sh,c.to.n)+(c.memo?'('+c.memo+')':'')}

    var long=Math.max(w,h),scale=Math.min(3,Math.max(1,2400/long)),cw=Math.round(w*scale),ch=Math.round(h*scale);
    var img=new Image();
    img.onload=function(){var c=document.createElement('canvas');c.width=cw;c.height=ch;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(img,0,0,cw,ch);res(c)};
    img.onerror=function(){rej(new Error('render'))};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
  });
}
function serial(o){return new XMLSerializer().serializeToString(o.el)}
function flash(t){$('#status').textContent=t;setTimeout(function(){setStatus(lastStat)},3500)}
function safeName(t){return String(t||'図').replace(/[\\\/:*?"<>|]/g,'_').slice(0,60)}
function saveOut(name,data){
  return dl.save({filename:name,data:data}).then(function(){flash('保存しました')},function(err){
    var c=err&&err.code;flash(c==='declined'?'キャンセルしました':(c==='rate_limited'?'少し待ってからもう一度':'保存できませんでした'));
  });
}
function exportPng(){
  if(!dl||expBusy)return;expBusy=true;flash('画像を作成中…');
  var sh=cur(),o=viewMode==='plan'?buildPlanSvg(sh):buildWireSvg(sh);
  if(!o){expBusy=false;flash(viewMode==='plan'?'機材を配置すると書き出せます':'機材を追加すると書き出せます');return}
  svgToCanvas(serial(o),o.w,o.h).then(function(c){
    return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/png')});
  }).then(function(b){return saveOut(safeName(sh.name)+(viewMode==='plan'?'_会場レイアウト.png':'_配線図.png'),b)})
  .catch(function(){flash('画像を作れませんでした')}).then(function(){expBusy=false});
}
function exportPdf(){
  if(!dl||expBusy)return;
  var J=window.jspdf&&window.jspdf.jsPDF;if(!J){flash('PDFの部品を読み込めませんでした');return}
  expBusy=true;flash('PDFを作成中…');
  var sh=cur(),items=[],w=buildWireSvg(sh),pl2=buildPlanSvg(sh);
  if(w)items.push({xml:serial(w),w:w.w,h:w.h});
  if(pl2)items.push({xml:serial(pl2),w:pl2.w,h:pl2.h});
  buildTextPages(sh).forEach(function(t){items.push(t)});
  Promise.all(items.map(function(i){return svgToCanvas(i.xml,i.w,i.h)})).then(function(cvs){
    var doc=new J({orientation:'landscape',unit:'mm',format:'a4'}),pw=297,ph=210,m=8;
    cvs.forEach(function(c,i){
      if(i)doc.addPage();
      var r=Math.min((pw-m*2)/c.width,(ph-m*2)/c.height),ww=c.width*r,hh=c.height*r;
      doc.addImage(c.toDataURL('image/png'),'PNG',(pw-ww)/2,(ph-hh)/2,ww,hh,undefined,'FAST');
    });
    return saveOut(safeName(sh.name)+'_配線図セット.pdf',doc.output('blob'));
  }).catch(function(){flash('PDFを作れませんでした')}).then(function(){expBusy=false});
}
$('#expPng').addEventListener('click',exportPng);
$('#expPdf').addEventListener('click',exportPdf);
function browserSave(o){
  return new Promise(function(res){
    var b=o.data instanceof Blob?o.data:new Blob([o.data]),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);res({status:'saved'});
  });
}
if(!(window.claude&&window.claude.use)){dl={save:browserSave};$('#exp').hidden=false}
if(window.claude&&window.claude.use){window.claude.use('downloads').then(function(d){if(d){dl=d;$('#exp').hidden=false}}).catch(function(){})}

/* ---------- boot ---------- */
state=loadLocal()||newState();
$('#undo').disabled=true;
renderPalette();renderChips();
fitView();renderAll();
requestAnimationFrame(function(){fitView();applyView()});
setStatus(localSavedAt?'local':'loading');
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
initDb();
if(location.hash==='#plan')setView('plan',true);
})();
</script>
